"Um dein Widerrufsrecht auszuüben, musst du uns (Markus Döbele, Herdweg 130, 71032 Böblingen, E-Mail: markus.doebele@posteo.de) mittels einer eindeutigen Erklärung (z. B. eine E-Mail) über deinen Entschluss, diesen Vertrag zu widerrufen, informieren. Du kannst dafür das unten stehende Muster-Widerrufsformular verwenden, das jedoch nicht vorgeschrieben ist. Zur Wahrung der Widerrufsfrist reicht es aus, dass du die Mitteilung über die Ausübung des Widerrufsrechts vor Ablauf der Widerrufsfrist absendest.": "To exercise your right of withdrawal, you must inform us (Markus Döbele, Herdweg 130, 71032 Böblingen, Germany, e-mail: markus.doebele@posteo.de) of your decision to withdraw from this contract by an unequivocal statement (e.g. an e-mail). You may use the model withdrawal form below, but it is not obligatory. To meet the withdrawal deadline, it is sufficient for you to send your communication concerning your exercise of the right of withdrawal before the withdrawal period has expired."
