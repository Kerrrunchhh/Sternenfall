"Wählst du mehrere Flotten aus – auch solche, die Allianzmitglieder für dich freigegeben haben –, greifen sie als Verband an und kommen gemeinsam an (mit der langsamsten). Weitere Flotten kannst du einem laufenden Angriff, den du führst, dazuschicken, wenn sie rechtzeitig ankommen. Die Beute wird nach freiem Frachtraum geteilt; die Invasionsschiffe aller Flotten zählen zusammen. Mindestregel: Die Flotten jedes Spielers im Angriff müssen zusammen mindestens 1 % seiner gesamten Flottenstärke oder 10 % seiner Schiffe einer Klasse sein.": "If you select several fleets – also those released to you by alliance members –, they attack as a formation and arrive together (with the slowest). You can send further fleets to a running attack you lead if they arrive in time. The loot is shared by free cargo space; the invasion ships of all fleets count together. Minimum rule: the fleets of every player in the attack must together be at least 1 % of their total fleet strength or 10 % of their ships of one class."
