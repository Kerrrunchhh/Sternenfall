"Biete Credits für den <strong>Schutz</strong> eines deiner Planeten (der Auftragnehmer darf dort so lange Schiffe stationieren) oder für eine <strong>Invasion</strong> (ist das Ziel eine Fusion, muss sie zuerst gesprengt und dann der oberste Planet invadiert werden). Die Belohnung wird beim Anlegen verwahrt und nur bei Erfolg ausgezahlt – sonst bekommst du sie zurück.": "Offer credits for the <strong>protection</strong> of one of your planets (the contractor may station ships there for that long) or for an <strong>invasion</strong> (if the target is a fusion, it must be blown apart first and then the top planet invaded). The reward is held in escrow when you create the contract and only paid out on success – otherwise you get it back."
