"<strong>5 € im Monat</strong>, monatlich über PayPal, jederzeit kündbar. Nach der Kündigung läuft der bezahlte Monat zu Ende.": "<strong>5 € per month</strong>, billed monthly via PayPal, cancel any time. After cancelling, the paid month runs until its end."
"<strong>Bündnis</strong>: Schiffe dürfen auf allen Planeten der anderen Allianz landen und bleiben; ihr greift euch nicht an. <strong>Nichtangriffspakt</strong>: weder Planeten noch Schiffe der anderen Allianz sind angreifbar. <strong>Krieg</strong>: invadierte Planeten der Gegner belegen nur 2 statt 3 Planetenplätze. Vorschlagen und abstimmen dürfen Gründer und Kommandanten; es entscheidet die Mehrheit. Bündnis und Nichtangriffspakt muss danach auch die andere Allianz annehmen – Krieg wird einseitig erklärt. Bündnis und Pakt beendet eine Seite allein; Frieden müssen beide wollen.": "<strong>Alliance pact</strong>: ships may land and stay on all planets of the other alliance; you don’t attack each other. <strong>Non-aggression pact</strong>: neither planets nor ships of the other alliance can be attacked. <strong>War</strong>: invaded enemy planets take only 2 instead of 3 planet slots. Founders and commanders propose and vote; the majority decides. An alliance pact or non-aggression pact must then be accepted by the other alliance as well – war is declared one-sided. One side alone ends a pact; peace needs both."
