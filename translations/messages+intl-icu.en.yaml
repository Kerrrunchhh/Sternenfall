"Das Spiel befindet sich in Entwicklung. Regeln, Werte und Funktionen können sich ändern; in der Testphase kann das Universum neu gestartet werden. Es besteht kein Anspruch auf einen bestimmten Spielstand, auf bestimmte Spielinhalte oder auf ständige Erreichbarkeit. Planeten, Schiffe, Rohstoffe und Credits haben keinen Geldwert und können nicht ausgezahlt werden.": "The game is in development. Rules, values and features may change; during the test phase the universe may be restarted. There is no claim to a certain game state, to certain game content or to constant availability. Planets, ships, resources and credits have no monetary value and can’t be paid out."
"Das Spiel ist kostenlos. Jede Person darf nur ein Spielkonto haben; Mehrfach-Accounts, das Teilen oder Weitergeben eines Kontos und das Spielen für andere sind nicht erlaubt. Du musst mindestens 16 Jahre alt sein oder die Zustimmung deiner Eltern haben. Halte dein Passwort geheim.": "The game is free. Every person may only have one game account; multiple accounts, sharing or passing on an account and playing for others are not allowed. You must be at least 16 years old or have your parents’ consent. Keep your password secret."
"Das Spiel läuft auf einem Server der Hetzner Online GmbH, Industriestr. 25, 91710 Gunzenhausen, Deutschland. Der Server steht in einem Rechenzentrum in Helsinki (Finnland), also innerhalb der EU. Hetzner verarbeitet die Daten nur in unserem Auftrag auf Grundlage eines Vertrags zur Auftragsverarbeitung (Art. 28 DSGVO).": "The game runs on a server of Hetzner Online GmbH, Industriestr. 25, 91710 Gunzenhausen, Germany. The server is located in a data center in Helsinki (Finland), i.e. within the EU. Hetzner processes the data only on our behalf on the basis of a data processing agreement (Art. 28 GDPR)."
