"Danke für dein Abo! Hiermit bestätigen wir den Vertrag über den erweiterten Account im Spiel {game}:\n\n– Preis: 5,00 € pro Monat, Zahlung über PayPal im Voraus, verlängert sich monatlich, jederzeit zum Monatsende kündbar (im Spiel unter „Erweiterter Account“ oder bei PayPal).\n– Abo-Kennung: {subscription}\n– Abgeschlossen am: {date}\n\nDu hast ausdrücklich verlangt, dass der erweiterte Account sofort beginnt, und bestätigt, dass dir bekannt ist, dass du dadurch dein Widerrufsrecht verlierst.\n\nDie Nutzungsbedingungen mit der Widerrufsbelehrung findest du unter {terms}.": "Thank you for your subscription! We hereby confirm the contract for the extended account in the game {game}:\n\n– Price: €5.00 per month, paid in advance via PayPal, renews monthly, can be cancelled at any time to the end of the month (in the game under “Extended account” or at PayPal).\n– Subscription ID: {subscription}\n– Concluded on: {date}\n\nYou expressly requested that the extended account starts immediately and confirmed that you are aware that you thereby lose your right of withdrawal.\n\nThe terms of use with the cancellation policy can be found at {terms}."
