"48 Stunden nach dem Antrag ist dein Konto gelöscht. Meldest du dich vorher wieder an, wird die Löschung abgebrochen. Deine Planeten bleiben als <strong>herrenlose Planeten</strong> im Universum – mit allen Rohstoffen, Schiffen und Verteidigungsanlagen. Andere Spieler können sie angreifen und mit Invasionsschiffen übernehmen. Deine Flotten und Handelsstützpunkte bleiben ebenfalls zurück.": "Your account is deleted 48 hours after the request. If you log in again before that, the deletion is cancelled. Your planets stay in the universe as <strong>ownerless planets</strong> – with all resources, ships and defenses. Other players can attack them and take them over with invasion ships. Your fleets and trade posts stay behind as well."
