"„Fusionieren“</a> zu diesem Planeten; steht sie schon hier, geht es sofort. Pro Fusion wird ein Fusionator verbraucht, weitere fliegen zurück. <strong>Fusionen lohnen sich:</strong> Sie zählen immer als blauer Planet (doppeltes Bevölkerungswachstum) und produzieren alle Rohstoffe ×1,5. Gebäudestufen, Rohstoffe, Bevölkerung, Schiffe und Flotten werden zusammengelegt. Laufende Gebäudebauten und die laufende Forschung werden abgebrochen. Invadierte Planeten können erst nach 4 Wochen fusioniert werden. Fusionatoren bauen nur Händler.": "“Fuse”</a> to this planet; if it is already here, it happens at once. One fusionator is used up per fusion, the rest fly back. <strong>Fusions pay off:</strong> they always count as a blue planet (double population growth) and produce all resources ×1.5. Building levels, resources, population, ships and fleets are combined. Running constructions and the running research are cancelled. Invaded planets can only be fused after 4 weeks. Only traders build fusionators."
"„UND“ bindet stärker als „ODER“: <em>A UND B ODER C</em> heißt <em>(A UND B) ODER C</em>. „genau 0 × Falke“ findet Flotten ohne Falken. Ausgefilterte Flotten werden abgewählt. „Filter anwenden“ aus zeigt alle Flotten des Reiters, die Regeln bleiben erhalten.": "“AND” binds more strongly than “OR”: <em>A AND B OR C</em> means <em>(A AND B) OR C</em>. “exactly 0 × Falcon” finds fleets without Falcons. Filtered-out fleets are deselected. Switching “Apply filter” off shows all fleets of the tab, the rules are kept."
