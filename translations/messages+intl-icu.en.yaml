"Mehr dazu, wie Google Daten aus Werbung nutzt:": "More on how Google uses data from ads:"
"Mehrere Accounts einer Person verfälschen das Spiel. Bei jeder Anmeldung speichern wir deshalb die IP-Adresse, die Browserkennung (User-Agent) und den Zeitpunkt. Moderatoren und Administratoren sehen, welche Accounts sich eine IP-Adresse teilen, und entscheiden selbst, ob ein Verstoß vorliegt – automatisch gesperrt wird niemand. Rechtsgrundlage ist unser berechtigtes Interesse an einem fairen Spiel (Art. 6 Abs. 1 lit. f DSGVO). Die Einträge werden nach 30 Tagen gelöscht.": "Several accounts of one person distort the game. That’s why we store the IP address, the browser identification (user agent) and the time of every login. Moderators and administrators see which accounts share an IP address and decide themselves whether there is a violation – nobody is blocked automatically. The legal basis is our legitimate interest in a fair game (Art. 6 (1) (f) GDPR). The entries are deleted after 30 days."
