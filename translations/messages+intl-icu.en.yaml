"Bei Verstößen kann die Spielleitung verwarnen, das Konto für eine Zeit in den Urlaub schicken (sperren), Inhalte löschen oder das Konto löschen. Bei einem gelöschten Konto mit erweitertem Account wird der bereits bezahlte Zeitraum nicht erstattet, wenn die Löschung auf einem schweren Verstoß beruht.": "In case of violations the game management may warn, send the account on vacation for a while (block it), delete content or delete the account. If an account with an extended account is deleted because of a serious violation, the period already paid is not refunded."
