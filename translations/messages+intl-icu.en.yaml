"Alle E-Mails des Spiels, also auch der Bestätigungslink bei der Registrierung, werden über Gmail verschickt. Anbieter ist die Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Irland. Google erhält dabei deine E-Mail-Adresse und den Inhalt der Nachricht. Daten können dabei auch an die Google LLC in den USA übermittelt werden. Google ist nach dem EU-US Data Privacy Framework zertifiziert, für das die EU-Kommission ein angemessenes Datenschutzniveau festgestellt hat (Art. 45 DSGVO). Mehr dazu in der <a href=\"https://policies.google.com/privacy?hl=de\" target=\"_blank\" rel=\"noopener\">Datenschutzerklärung von Google</a>.": "All e-mails of the game, including the confirmation link at registration, are sent via Gmail. The provider is Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Ireland. Google receives your e-mail address and the content of the message. Data may also be transferred to Google LLC in the USA. Google is certified under the EU-US Data Privacy Framework, for which the EU Commission has determined an adequate level of data protection (Art. 45 GDPR). More in <a href=\"https://policies.google.com/privacy?hl=en\" target=\"_blank\" rel=\"noopener\">Google’s privacy policy</a>."
