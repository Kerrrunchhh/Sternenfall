"Bei einer Rückfrage gehört die Frage dazu.": "For a follow-up question, the question belongs to it."
"Bei jedem Aufruf der Seite speichert der Webserver automatisch: IP-Adresse, Datum und Uhrzeit, aufgerufene Adresse, Statuscode, übertragene Datenmenge, die zuvor besuchte Seite (Referrer) und Browserkennung (User-Agent). Das ist nötig, um den Betrieb sicherzustellen, Fehler zu finden und Angriffe abzuwehren (berechtigtes Interesse, Art. 6 Abs. 1 lit. f DSGVO). Die Logdateien werden nach 14 Tagen automatisch gelöscht.": "On every page view, the web server automatically stores: IP address, date and time, requested address, status code, amount of data transferred, the previously visited page (referrer) and browser identification (user agent). This is necessary to ensure operation, find errors and fend off attacks (legitimate interest, Art. 6 (1) (f) GDPR). The log files are deleted automatically after 14 days."
"Beim Sprengen entstehen die Planeten wieder. Gebäudestufen, Rohstoffe und Bevölkerung werden so gleichmäßig wie möglich verteilt, die Schiffe bleiben auf {name}. <strong>Alle Verteidigungsanlagen werden dabei zerstört.</strong>": "Blowing it apart recreates the planets. Building levels, resources and population are distributed as evenly as possible, the ships stay on {name}. <strong>All defenses are destroyed in the process.</strong>"
"Beim ersten Besuch fragt dich ein Hinweis von Google, ob du personalisierter Werbung und den dafür nötigen Cookies zustimmst. Rechtsgrundlage ist deine Einwilligung (Art. 6 Abs. 1 lit. a DSGVO, § 25 Abs. 1 TDDDG); ohne sie zeigt Google nur nicht personalisierte Werbung. Deine Wahl kannst du jederzeit über den Link „Datenschutzeinstellungen“ bzw. das Symbol von Google auf der Seite ändern. Daten können an die Google LLC in den USA übermittelt werden; Google ist nach dem EU-US Data Privacy Framework zertifiziert.": "On your first visit a notice from Google asks whether you agree to personalized ads and the cookies needed for them. The legal basis is your consent (Art. 6 (1) (a) GDPR, § 25 (1) TDDDG); without it Google only shows non-personalized ads. You can change your choice at any time via the “Privacy settings” link or Google’s icon on the page. Data may be transferred to Google LLC in the USA; Google is certified under the EU-US Data Privacy Framework."
