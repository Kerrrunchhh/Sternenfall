"Im Urlaub ruht alles: keine Produktion, kein Bau, keine Forschung, keine Flotten. Deine Planeten können nicht angegriffen werden – außer invadierten Planeten, die dir noch nicht ganz gehören –, ausspioniert werden aber schon. Schreiben, lesen und schauen geht weiter: Post, Ticker, schwarzes Brett, Galaxie, Allianz und Diplomatie. Urlaub dauert {vacation_min} bis {vacation_max} Tage; Kommazahlen sind erlaubt (2,5 Tage = 60 Stunden), so endet er genau zu deiner Wunschzeit. Vorzeitig beenden kannst du ihn frühestens nach einem Tag. Alle Flotten müssen gelandet sein.": "On vacation everything rests: no production, no construction, no research, no fleets. Your planets can’t be attacked – except invaded planets that don’t fully belong to you yet –, but they can be spied on. Writing, reading and looking around continue: mail, tickers, bulletin board, galaxy, alliance and diplomacy. A vacation lasts {vacation_min} to {vacation_max} days; decimals are allowed (2.5 days = 60 hours), so it ends exactly at the time you want. You can end it early after one day at the earliest. All fleets must have landed."
