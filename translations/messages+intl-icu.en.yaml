"Zusätzlich berechnet dein Browser beim Anmelden aus einigen Merkmalen (Bildschirm, Zeitzone, Sprache, Darstellung einer kleinen Grafik) eine Gerätekennung als nicht umkehrbaren Hashwert und schickt sie mit. Sie dient ausschließlich dazu, Mehrfach-Accounts zu erkennen; ohne diesen Schutz wäre ein faires Mehrspieler-Spiel nicht möglich. Rechtsgrundlage sind § 25 Abs. 2 Nr. 2 TDDDG (für den Dienst unbedingt erforderlich) und unser berechtigtes Interesse an einem fairen Spiel (Art. 6 Abs. 1 lit. f DSGVO). Die Kennung sehen nur Moderatoren und Administratoren; sie wird nach 30 Tagen gelöscht. Du kannst der Verarbeitung aus Gründen, die sich aus deiner besonderen Situation ergeben, widersprechen (Art. 21 DSGVO).": "In addition, your browser computes a device identifier from a few properties (screen, time zone, language, rendering of a small graphic) as an irreversible hash value when you log in and sends it along. It serves exclusively to detect multiple accounts; without this protection a fair multiplayer game would not be possible. The legal basis is § 25 (2) no. 2 TDDDG (strictly necessary for the service) and our legitimate interest in a fair game (Art. 6 (1) (f) GDPR). Only moderators and administrators see the identifier; it is deleted after 30 days. You can object to the processing on grounds relating to your particular situation (Art. 21 GDPR)."
