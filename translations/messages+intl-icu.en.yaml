"Wir können diese Bedingungen ändern; über Änderungen, die den erweiterten Account betreffen, informieren wir dich vorher im Spiel. Es gilt deutsches Recht; zwingende Verbraucherschutzvorschriften deines Wohnsitzlandes bleiben unberührt. Wir sind nicht verpflichtet und nicht bereit, an Streitbeilegungsverfahren vor einer Verbraucherschlichtungsstelle teilzunehmen.": "We may change these terms; we inform you in the game in advance about changes concerning the extended account. German law applies; mandatory consumer protection provisions of your country of residence remain unaffected. We are neither obliged nor willing to take part in dispute resolution proceedings before a consumer arbitration board."
"Wir schicken dir einen Link zur Bestätigung. Optional bekommst du später Warnungen bei Angriffen.": "We send you a link for confirmation. Optionally you will later get warnings about attacks."
"Wir selbst setzen nur ein technisch notwendiges Cookie: das Sitzungs-Cookie, das dich nach der Anmeldung angemeldet hält. Es wird beim Abmelden oder Schließen des Browsers ungültig. Cookies von Google für die Werbung beschreibt der Absatz unten.": "We ourselves only set one technically necessary cookie: the session cookie that keeps you logged in after login. It becomes invalid when you log out or close the browser. Google’s cookies for advertising are described in the paragraph below."
