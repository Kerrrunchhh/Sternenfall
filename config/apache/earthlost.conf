# Apache-VHost für die lokale Entwicklung.
# Installation: siehe Kommentare unten bzw. Anleitung im Chat.
<VirtualHost *:80>
        ServerName      earthlost.test

        HostnameLookups  Off
        UseCanonicalName Off
        ServerSignature  Off

        DocumentRoot    /var/www/earthlost/public

        <IfModule setenvif_module>
                SetEnvIfNoCase ^Authorization$ "(.+)" HTTP_AUTHORIZATION=$1
        </IfModule>

        <Directory /var/www/earthlost/public>
                Options -Indexes -FollowSymLinks
                AllowOverride None
                Require all granted
                # Alles, was keine echte Datei ist, geht an den Symfony Front-Controller
                FallbackResource /index.php
        </Directory>

        # Nur public/ ist erreichbar; der Rest des Projekts (inkl. .env*) liegt außerhalb des DocumentRoot.

        ErrorLog        ${APACHE_LOG_DIR}/earthlost.error.log
        CustomLog       ${APACHE_LOG_DIR}/earthlost.access.log combined
</VirtualHost>
