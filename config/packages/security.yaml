security:
    # Admins can do everything moderators can.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_MODERATOR]
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build|css|js)/)
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_overview
            logout:
                path: app_logout
                target: app_home
            login_throttling:
                max_attempts: 5
            # Account switcher for testing: only users with ROLE_ALLOWED_TO_SWITCH may use it.
            switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/(login|register)?$, roles: PUBLIC_ACCESS }
        # Shared combat reports can be read without logging in.
        - { path: ^/kampfbericht/, roles: PUBLIC_ACCESS }
        - { path: ^/(status|impressum|datenschutz)$, roles: PUBLIC_ACCESS }
        - { path: ^/email/, roles: PUBLIC_ACCESS }
        - { path: ^/paypal/webhook$, roles: PUBLIC_ACCESS }
        - { path: ^/ads\.txt$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
